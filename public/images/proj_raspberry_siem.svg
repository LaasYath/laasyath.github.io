<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#0d0d0d"/>

  <!-- PCB trace grid -->
  <line x1="180" y1="108" x2="352" y2="108" stroke="rgba(245,158,11,0.14)" stroke-width="1.5"/>
  <line x1="448" y1="108" x2="620" y2="108" stroke="rgba(245,158,11,0.14)" stroke-width="1.5"/>
  <line x1="180" y1="155" x2="335" y2="155" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <line x1="465" y1="155" x2="620" y2="155" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <line x1="180" y1="245" x2="335" y2="245" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <line x1="465" y1="245" x2="620" y2="245" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <line x1="180" y1="292" x2="352" y2="292" stroke="rgba(245,158,11,0.14)" stroke-width="1.5"/>
  <line x1="448" y1="292" x2="620" y2="292" stroke="rgba(245,158,11,0.14)" stroke-width="1.5"/>

  <line x1="240" y1="85"  x2="240" y2="155" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>
  <line x1="240" y1="155" x2="240" y2="245" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>
  <line x1="240" y1="245" x2="240" y2="315" stroke="rgba(245,158,11,0.1)"  stroke-width="1.5"/>
  <line x1="560" y1="85"  x2="560" y2="155" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>
  <line x1="560" y1="155" x2="560" y2="245" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>
  <line x1="560" y1="245" x2="560" y2="315" stroke="rgba(245,158,11,0.1)"  stroke-width="1.5"/>
  <line x1="352" y1="85"  x2="352" y2="140" stroke="rgba(245,158,11,0.1)"  stroke-width="1.5"/>
  <line x1="448" y1="85"  x2="448" y2="140" stroke="rgba(245,158,11,0.1)"  stroke-width="1.5"/>

  <!-- Central chip body -->
  <rect x="340" y="140" width="120" height="120" rx="3"
    fill="rgba(245,158,11,0.07)" stroke="rgba(245,158,11,0.5)" stroke-width="1.5"/>

  <!-- Chip pins top -->
  <line x1="362" y1="132" x2="362" y2="140" stroke="rgba(245,158,11,0.45)" stroke-width="2"/>
  <line x1="382" y1="132" x2="382" y2="140" stroke="rgba(245,158,11,0.45)" stroke-width="2"/>
  <line x1="402" y1="132" x2="402" y2="140" stroke="rgba(245,158,11,0.45)" stroke-width="2"/>
  <line x1="422" y1="132" x2="422" y2="140" stroke="rgba(245,158,11,0.45)" stroke-width="2"/>
  <line x1="442" y1="132" x2="442" y2="140" stroke="rgba(245,158,11,0.45)" stroke-width="2"/>
  <!-- Chip pins bottom -->
  <line x1="362" y1="260" x2="362" y2="268" stroke="rgba(245,158,11,0.45)" stroke-width="2"/>
  <line x1="382" y1="260" x2="382" y2="268" stroke="rgba(245,158,11,0.45)" stroke-width="2"/>
  <line x1="402" y1="260" x2="402" y2="268" stroke="rgba(245,158,11,0.45)" stroke-width="2"/>
  <line x1="422" y1="260" x2="422" y2="268" stroke="rgba(245,158,11,0.45)" stroke-width="2"/>
  <line x1="442" y1="260" x2="442" y2="268" stroke="rgba(245,158,11,0.45)" stroke-width="2"/>
  <!-- Chip pins left -->
  <line x1="332" y1="162" x2="340" y2="162" stroke="rgba(245,158,11,0.45)" stroke-width="2"/>
  <line x1="332" y1="182" x2="340" y2="182" stroke="rgba(245,158,11,0.45)" stroke-width="2"/>
  <line x1="332" y1="202" x2="340" y2="202" stroke="rgba(245,158,11,0.45)" stroke-width="2"/>
  <line x1="332" y1="222" x2="340" y2="222" stroke="rgba(245,158,11,0.45)" stroke-width="2"/>
  <line x1="332" y1="242" x2="340" y2="242" stroke="rgba(245,158,11,0.45)" stroke-width="2"/>
  <!-- Chip pins right -->
  <line x1="460" y1="162" x2="468" y2="162" stroke="rgba(245,158,11,0.45)" stroke-width="2"/>
  <line x1="460" y1="182" x2="468" y2="182" stroke="rgba(245,158,11,0.45)" stroke-width="2"/>
  <line x1="460" y1="202" x2="468" y2="202" stroke="rgba(245,158,11,0.45)" stroke-width="2"/>
  <line x1="460" y1="222" x2="468" y2="222" stroke="rgba(245,158,11,0.45)" stroke-width="2"/>
  <line x1="460" y1="242" x2="468" y2="242" stroke="rgba(245,158,11,0.45)" stroke-width="2"/>

  <!-- Chip label -->
  <text x="400" y="196" text-anchor="middle" font-family="monospace" font-size="13"
    fill="rgba(245,158,11,0.7)" letter-spacing="3">SIEM</text>
  <text x="400" y="216" text-anchor="middle" font-family="monospace" font-size="8"
    fill="rgba(255,255,255,0.28)" letter-spacing="2">RASPBERRY PI</text>

  <!-- Via dots -->
  <circle cx="240" cy="108" r="4" fill="rgba(245,158,11,0.3)" stroke="rgba(245,158,11,0.5)" stroke-width="1"/>
  <circle cx="560" cy="108" r="4" fill="rgba(245,158,11,0.3)" stroke="rgba(245,158,11,0.5)" stroke-width="1"/>
  <circle cx="240" cy="292" r="4" fill="rgba(245,158,11,0.3)" stroke="rgba(245,158,11,0.5)" stroke-width="1"/>
  <circle cx="560" cy="292" r="4" fill="rgba(245,158,11,0.3)" stroke="rgba(245,158,11,0.5)" stroke-width="1"/>

  <!-- Label -->
  <text x="400" y="350" text-anchor="middle" font-family="monospace" font-size="11"
    fill="rgba(255,255,255,0.3)" letter-spacing="5">RASPBERRY PI SIEM</text>
  <rect x="300" y="362" width="200" height="1" fill="rgba(245,158,11,0.3)"/>
</svg>
